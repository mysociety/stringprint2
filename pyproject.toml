[tool.poetry]
name = "stringprint2"
version = "0.1.0"
description = "Document publishing package"
authors = ["Alex Parsons <alex.parsons@mysociety.org>"]

[tool.poetry.scripts]
stringprint = "stringprint2.__main__:main"
stringprint-manage = "stringprint2.bootstrap:management_main"
stringprint-validate = "stringprint2.configuration.cli:main"
stringprint-migrate-tables = "stringprint2.configuration.table_migration_cli:main"

[tool.poetry.dependencies]
python = "^3.14"
Django = "5.2.17"
Markdown = ">=2.6.8"
Pillow = ">=8.3.2"
csscompressor = ">=0.9.4"
django-autoslug = ">=1.9.3"
olefile = ">=0.44"
six = ">=1.10.0"
django-import-export = ">=2.0.2,<3.0"
beautifulsoup4 = ">=4.10.0"
django-ipware = ">=2.1.0"
cobble = ">=0.1.3"
parsimonious = ">=0.8.1"
jsmin = ">=3.0.1"
dirsync = ">=2.2.3"
html2text = ">=2020.1.16"
# used by Article.export_paragraph_images (Chrome, in models.py) to drive a
# headless browser for the per-paragraph social-card screenshots. Used to be
# Selenium + a separately version-matched chromedriver; Asset.get_chart_image
# was the only other Selenium user and was dead/broken code, removed rather
# than fixed - so this replaced Selenium outright rather than sitting
# alongside it.
playwright = ">=1.40"
tinify = ">=1.5.1"
invoke = ">=1.7.0"
unicodecsv = ">=0.14.1"
django-htmlmin = ">=0.11.0"
"ruamel.yaml" = ">=0.17.21"
PyPDF2 = ">=1.26.0"
mammoth = ">=1.4.18"
html2markdown = ">=0.1.7"
django_compressor = ">=3.1"
watchdog = ">=0.9"
webptools = ">=0.0.2"
python-Levenshtein = ">=0.12.0"
mkepub = ">=1.2"
# mkepub calls puremagic.what(), which puremagic 2.0 renamed/removed; mkepub
# itself only declares puremagic>=1.30 with no upper bound, so pin it here.
puremagic = ">=1.30,<2.0"
django-static-precompiler = ">=2.1"
openpyxl = ">=2.6.4"
xlrd = ">=1.2.0"
PyMuPDF = ">=1.18.16"
rich = ">=12.0.1"
cookiecutter = ">=1.7.3"
google-api-python-client = ">=2.42.0"
oauth2client = ">=4.1.3"
python-unsplash = {git = "https://github.com/ajparsons/python-unsplash.git"}
pydantic = "^2.12"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-django = "^4.9"
ruff = "^0.16.5"
mypy = "^2.3.1"
django-stubs = "^6.1.0"

[tool.ruff]
target-version = "py314"
extend-exclude = [
    "stringprint2/static_sources",
    "stringprint2/vendor",
    "stringprint2/**/migrations",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"stringprint2/proj/settings.py" = ["F821"]
"stringprint2/stringprint/models.py" = ["F821"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
explicit_package_bases = true
python_version = "3.14"
strict = true
show_error_codes = true
files = [
    "stringprint2/bootstrap.py",
    "stringprint2/legacy_imports.py",
    "stringprint2/charts/chart_config.py",
    "stringprint2/proj/loaders.py",
    "stringprint2/serialization.py",
    "stringprint2/text_files.py",
    "stringprint2/table_files.py",
    "stringprint2/media_files.py",
    "stringprint2/cli_arguments.py",
    "stringprint2/configuration",
    "stringprint2/services",
    "stringprint2/publication_management",
]

[tool.django-stubs]
django_settings_module = "stringprint2.proj.test_settings"

[[tool.mypy.overrides]]
module = ["stringprint2.charts.chart_config"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["stringprint2.publication_management.apps"]
ignore_errors = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
