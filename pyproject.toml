[tool.poetry]
name = "stringprint2"
version = "0.1.0"
description = "Document publishing package"
authors = ["Alex Parsons <alex.parsons@mysociety.org>"]

[tool.poetry.dependencies]
python = "^3.14"
flake8 = ">=3.8.3"
Django = "5.2.17"
Markdown = ">=2.6.8"
Pillow = ">=8.3.2"
argparse = ">=1.2.1"
csscompressor = ">=0.9.4"
django-autoslug = ">=1.9.3"
django-markitup = ">=3.0.0"
django-pipeline = ">=1.6.11"
libsass = ">=0.12.3"
olefile = ">=0.44"
six = ">=1.10.0"
django-import-export = ">=2.0.2,<3.0"
beautifulsoup4 = ">=4.10.0"
django-bootstrap-form = ">=3.4"
django-ipware = ">=2.1.0"
cobble = ">=0.1.3"
parsimonious = ">=0.8.1"
jsmin = ">=3.0.1"
dirsync = ">=2.2.3"
html2text = ">=2020.1.16"
# used by Article.export_paragraph_images (Chrome, in models.py) to drive a
# headless browser for the per-paragraph social-card screenshots. Used to be
# Selenium + a separately version-matched chromedriver; Asset.get_chart_image
# was the only other Selenium user and was dead/broken code, removed rather
# than fixed - so this replaced Selenium outright rather than sitting
# alongside it.
playwright = ">=1.40"
tinify = ">=1.5.1"
invoke = ">=1.7.0"
unicodecsv = ">=0.14.1"
django-htmlmin = ">=0.11.0"
"ruamel.yaml" = ">=0.17.21"
PyPDF2 = ">=1.26.0"
mammoth = ">=1.4.18"
html2markdown = ">=0.1.7"
django_compressor = ">=3.1"
watchdog = ">=0.9"
webptools = ">=0.0.2"
python-Levenshtein = ">=0.12.0"
mkepub = ">=1.2"
# mkepub calls puremagic.what(), which puremagic 2.0 renamed/removed; mkepub
# itself only declares puremagic>=1.30 with no upper bound, so pin it here.
puremagic = ">=1.30,<2.0"
django-static-precompiler = ">=2.1"
xlwt = ">=1.3.0"
openpyxl = ">=2.6.4"
xlrd = ">=1.2.0"
PyMuPDF = ">=1.18.16"
black = ">=22.3.0"
pylint = ">=1.4.0"
rich = ">=12.0.1"
cookiecutter = ">=1.7.3"
google-api-python-client = ">=2.42.0"
oauth2client = ">=4.1.3"
django-pipeline-csscompressor = {git = "https://github.com/mysociety/django-pipeline-csscompressor.git"}
python-unsplash = {git = "https://github.com/ajparsons/python-unsplash.git"}
# useful-inkleby was previously a git dependency (ajparsons/useful_inkleby@d2).
# It supplied the view framework, serialisers and two custom model fields with
# no maintained Django 5 story, so it's vendored at stringprint2/useful_inkleby
# instead - same import path, sourced locally, one url() call fixed for
# Django 4.0's removal of django.conf.urls.url.
[tool.poetry.dev-dependencies]
pytest = "^7.4"
pytest-django = "^4.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
