<table class="table">
    <thead><tr><th>Publication</th><th>Operation</th><th>State</th><th>Created</th></tr></thead>
    <tbody>
    {% for operation in operations %}
        <tr>
            <td>{{ operation.publication_slug }}</td>
            <td><a href="{% url 'publication_management:operation_detail' operation.pk %}">{{ operation.operation_name }}</a></td>
            <td>{{ operation.get_state_display }}</td>
            <td>{{ operation.created_at }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="4">No operations.</td></tr>
    {% endfor %}
    </tbody>
</table>
