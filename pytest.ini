[pytest]
DJANGO_SETTINGS_MODULE = stringprint2.proj.test_settings
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --reuse-db -m "not external"
markers =
    external: needs an external binary or the network
    needs_chrome: needs Playwright Chromium
    needs_sass: needs sass and npx postcss
    needs_network: hits a third-party API
    slow: full render/bake pipeline
