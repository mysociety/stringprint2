[pytest]
DJANGO_SETTINGS_MODULE = proj.test_settings
testpaths = tests
# 'stringprint2' puts proj/stringprint/frontend/charts on the path as top-level
# packages; '.' additionally allows 'from stringprint2.charts import Chart',
# which stringprint/models.py does.
pythonpath = stringprint2 .
addopts = -q --strict-markers --reuse-db -m "not external"
markers =
    external: needs an external binary or the network
    needs_chrome: needs Playwright Chromium
    needs_sass: needs sass and npx postcss
    needs_network: hits a third-party API
    slow: full render/bake pipeline
